<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Charmander's Flame Adventure — 파이리의 불꽃 모험</title>

  <!-- ══ Firebase SDK (v9 compat) ══ -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:#060610;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      min-height:100vh;font-family:'Courier New',monospace;
      overflow:hidden;
    }

    /* ── 로딩 ── */
    #loading{
      position:fixed;inset:0;background:#060610;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      z-index:200;gap:16px;
    }
    #loading .flame{font-size:3rem;animation:pulse 1s ease-in-out infinite alternate;}
    #loading p{color:#f0c040;font-size:1rem;letter-spacing:.1em;}
    #loading .bar-wrap{width:240px;height:6px;background:#222;border-radius:3px;overflow:hidden;}
    #loading .bar{height:100%;background:linear-gradient(90deg,#f04000,#f0c040);
      border-radius:3px;animation:load 1.8s ease-in-out infinite;}

    /* ── 타이틀 ── */
    #title-screen{
      position:fixed;inset:0;
      background:radial-gradient(ellipse at center,#1a0a00 0%,#060610 70%);
      display:none;flex-direction:column;
      align-items:center;justify-content:center;
      z-index:100;gap:10px;
    }
    .t-flame{font-size:4rem;animation:flame 2s ease-in-out infinite alternate;}
    .t-en{font-size:.9rem;color:#cc8830;letter-spacing:.25em;margin-top:4px;}
    .t-ko{font-size:2rem;color:#f0c040;
      text-shadow:0 0 30px #f08000,0 0 60px #f04000;
      letter-spacing:.1em;animation:flicker 4s infinite;}
    .t-sub{color:#996622;font-size:.8rem;}
    .divider{width:200px;height:1px;
      background:linear-gradient(90deg,transparent,#f0c040,transparent);margin:16px 0;}
    .t-btn{
      padding:12px 48px;background:transparent;
      border:2px solid #f0c040;color:#f0c040;
      font-size:1rem;font-family:'Courier New',monospace;
      cursor:pointer;letter-spacing:.2em;transition:all .2s;
    }
    .t-btn:hover{background:#f0c040;color:#060610;box-shadow:0 0 20px #f0804080;}
    .t-hint{font-size:.7rem;color:#555;margin-top:10px;letter-spacing:.1em;}

    /* ── 로그인 패널 (우상단) ── */
    #auth-panel{
      position:fixed;top:12px;right:12px;z-index:300;
      display:flex;align-items:center;gap:8px;
    }
    .auth-box{
      background:rgba(8,8,30,0.92);
      border:1px solid #333;border-radius:8px;
      padding:8px 14px;display:flex;align-items:center;gap:10px;
      font-size:12px;color:#ccc;backdrop-filter:blur(4px);
      transition:all .2s;
    }
    .auth-box.visible{display:flex;}
    #auth-user-info{display:none;}
    #auth-user-info .avatar{
      width:28px;height:28px;border-radius:50%;
      background:#f0c040;display:flex;align-items:center;justify-content:center;
      font-size:14px;color:#111;font-weight:bold;flex-shrink:0;
    }
    #auth-user-info .uname{color:#f0c040;font-weight:bold;font-size:11px;}
    #auth-user-info .uemail{color:#777;font-size:10px;}
    .auth-btn{
      background:transparent;border:1px solid #555;color:#ccc;
      padding:4px 10px;border-radius:4px;cursor:pointer;
      font-family:'Courier New',monospace;font-size:11px;
      transition:all .2s;
    }
    .auth-btn:hover{border-color:#f0c040;color:#f0c040;}
    .auth-btn.primary{border-color:#f0c040;color:#f0c040;}
    .auth-btn.danger{border-color:#cc4444;color:#cc4444;}
    .auth-btn.danger:hover{background:#cc4444;color:#fff;}

    /* ── 로그인 모달 ── */
    #auth-modal{
      display:none;position:fixed;inset:0;
      background:rgba(0,0,0,0.7);z-index:500;
      align-items:center;justify-content:center;
    }
    #auth-modal.open{display:flex;}
    .modal-box{
      background:#0d0d24;border:1px solid #f0c040;
      border-radius:12px;padding:32px 36px;width:340px;
      display:flex;flex-direction:column;gap:14px;
    }
    .modal-box h2{color:#f0c040;font-size:1.1rem;text-align:center;
      letter-spacing:.1em;margin-bottom:4px;}
    .modal-box p{color:#888;font-size:.75rem;text-align:center;}
    .modal-divider{height:1px;background:#222;margin:4px 0;}
    .modal-box input{
      background:#111;border:1px solid #333;border-radius:6px;
      padding:10px 12px;color:#fff;font-family:'Courier New',monospace;
      font-size:13px;outline:none;transition:border .2s;
    }
    .modal-box input:focus{border-color:#f0c040;}
    .modal-box input::placeholder{color:#444;}
    .modal-submit{
      padding:11px;background:#f0c040;color:#111;border:none;
      border-radius:6px;font-family:'Courier New',monospace;
      font-size:13px;font-weight:bold;cursor:pointer;
      letter-spacing:.1em;transition:all .2s;
    }
    .modal-submit:hover{background:#f0a000;}
    .modal-or{text-align:center;color:#555;font-size:12px;position:relative;}
    .modal-or::before,.modal-or::after{
      content:'';position:absolute;top:50%;width:38%;height:1px;background:#333;
    }
    .modal-or::before{left:0;} .modal-or::after{right:0;}
    .google-btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      padding:10px;background:#fff;color:#333;border:none;border-radius:6px;
      font-size:13px;cursor:pointer;transition:all .2s;font-weight:500;
    }
    .google-btn:hover{background:#eee;}
    .google-btn svg{width:18px;height:18px;}
    .modal-toggle{
      text-align:center;color:#888;font-size:11px;cursor:pointer;
    }
    .modal-toggle span{color:#f0c040;text-decoration:underline;}
    .modal-close-btn{
      position:absolute;top:10px;right:14px;background:none;border:none;
      color:#555;font-size:1.2rem;cursor:pointer;
    }
    .modal-box{position:relative;}
    #auth-error{color:#ff6060;font-size:11px;text-align:center;min-height:16px;}
    .save-indicator{
      position:fixed;bottom:16px;right:16px;z-index:400;
      background:rgba(0,200,100,0.85);color:#fff;
      padding:6px 14px;border-radius:20px;font-size:11px;
      font-family:'Courier New',monospace;
      opacity:0;transition:opacity .4s;pointer-events:none;
    }
    .save-indicator.show{opacity:1;}

    /* ── 게임 캔버스 ── */
    #game-wrapper{position:relative;display:none;}
    canvas#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}

    /* ── 키프레임 ── */
    @keyframes pulse{from{transform:scale(1);}to{transform:scale(1.2);}}
    @keyframes flame{from{transform:scale(1) rotate(-4deg);}to{transform:scale(1.15) rotate(4deg);}}
    @keyframes flicker{0%,90%,100%{opacity:1;}95%{opacity:.6;}}
    @keyframes load{0%{width:0%;}50%{width:70%;}100%{width:100%;}}
  </style>
</head>
<body>

<!-- 로딩 -->
<div id="loading">
  <div class="flame">🔥</div>
  <p>불꽃을 불러오는 중...</p>
  <div class="bar-wrap"><div class="bar"></div></div>
</div>

<!-- 타이틀 -->
<div id="title-screen">
  <div class="t-flame">🔥</div>
  <p class="t-en">Charmander's Flame Adventure</p>
  <h1 class="t-ko">파이리의 불꽃 모험</h1>
  <p class="t-sub">꺼져가는 태초의 불씨를 되살리기 위한 여정</p>
  <div class="divider"></div>
  <button class="t-btn" id="startBtn">▶ 게임 시작</button>
  <p class="t-hint">WASD · 방향키 이동 &nbsp;|&nbsp; 스페이스 대화</p>
</div>

<!-- 로그인 패널 (우상단) -->
<div id="auth-panel">
  <!-- 로그아웃 상태 -->
  <div class="auth-box" id="auth-login-box">
    <span style="color:#888;font-size:11px;">👤 비로그인</span>
    <button class="auth-btn primary" id="openLoginBtn">로그인</button>
  </div>
  <!-- 로그인 상태 -->
  <div class="auth-box" id="auth-user-info">
    <div class="avatar" id="user-avatar">?</div>
    <div>
      <div class="uname" id="user-name">—</div>
      <div class="uemail" id="user-email">—</div>
    </div>
    <button class="auth-btn" id="saveBtn">💾 저장</button>
    <button class="auth-btn danger" id="logoutBtn">로그아웃</button>
  </div>
</div>

<!-- 로그인 모달 -->
<div id="auth-modal">
  <div class="modal-box">
    <button class="modal-close-btn" id="modalCloseBtn">✕</button>
    <h2>🔥 로그인 / 회원가입</h2>
    <p>로그인하면 진행 상황이 저장됩니다</p>
    <div class="modal-divider"></div>

    <!-- Google 로그인 -->
    <button class="google-btn" id="googleLoginBtn">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 계속하기
    </button>

    <div class="modal-or">또는</div>

    <!-- 이메일 로그인/회원가입 -->
    <input type="email" id="auth-email" placeholder="이메일"/>
    <input type="password" id="auth-password" placeholder="비밀번호 (6자 이상)"/>
    <div id="auth-error"></div>
    <button class="modal-submit" id="emailAuthBtn">로그인</button>
    <div class="modal-toggle" id="authToggle">
      계정이 없으신가요? <span id="authToggleSpan">회원가입</span>
    </div>
  </div>
</div>

<!-- 저장 알림 -->
<div class="save-indicator" id="saveIndicator">✅ 저장 완료!</div>

<!-- 게임 캔버스 -->
<div id="game-wrapper">
  <canvas id="game"></canvas>
</div>

<!-- 에셋 + 게임 JS -->
<script src="assets_b64.js"></script>
<script src="game.js"></script>

<script>
// =============================================
//   Firebase 설정
//   👇 여기에 본인 Firebase 프로젝트 설정을 붙여넣으세요
// =============================================
const firebaseConfig = {
  apiKey: "AIzaSyDVO7lHVaJDWruSqOE4TXKZ41IfDyiBi00",
  authDomain: "charmander-flame-adventure.firebaseapp.com",
  databaseURL: "https://charmander-flame-adventure-default-rtdb.firebaseio.com",
  projectId: "charmander-flame-adventure",
  storageBucket: "charmander-flame-adventure.firebasestorage.app",
  messagingSenderId: "657736254170",
  appId: "1:657736254170:web:af9dd33732825350c21be3",
  measurementId: "G-FETQ4NCC10"
};

// =============================================
//   Firebase 초기화
// =============================================
let db, auth, isFirebaseReady = false;
try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db   = firebase.firestore();
  isFirebaseReady = true;
} catch(e) {
  console.warn('Firebase 미설정 — 오프라인 모드로 실행:', e.message);
}

// =============================================
//   Firestore 저장/불러오기
// =============================================
window.firebaseSave = async (userId, data) => {
  if (!isFirebaseReady) return;
  try {
    await db.collection('saves').doc(userId).set(data, { merge: true });
    showSaveIndicator();
  } catch(e) { console.error('저장 실패:', e); }
};

async function loadSave(userId) {
  if (!isFirebaseReady) return null;
  try {
    const doc = await db.collection('saves').doc(userId).get();
    return doc.exists ? doc.data() : null;
  } catch(e) { console.error('불러오기 실패:', e); return null; }
}

function showSaveIndicator() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// =============================================
//   Auth 상태 관리
// =============================================
window._currentUser = null;

if (isFirebaseReady) {
  auth.onAuthStateChanged(async user => {
    window._currentUser = user;
    updateAuthUI(user);
    if (user) {
      const data = await loadSave(user.uid);
      if (data && window._onSaveLoaded) window._onSaveLoaded(data);
    }
  });
}

function updateAuthUI(user) {
  const loginBox  = document.getElementById('auth-login-box');
  const userInfo  = document.getElementById('auth-user-info');
  if (user) {
    loginBox.style.display  = 'none';
    userInfo.style.display  = 'flex';
    const name  = user.displayName || user.email?.split('@')[0] || '유저';
    const email = user.email || '';
    document.getElementById('user-name').textContent  = name;
    document.getElementById('user-email').textContent = email;
    document.getElementById('user-avatar').textContent = name[0].toUpperCase();
  } else {
    loginBox.style.display  = 'flex';
    userInfo.style.display  = 'none';
  }
}

// =============================================
//   로그인 모달 UI
// =============================================
const modal      = document.getElementById('auth-modal');
const emailInput = document.getElementById('auth-email');
const passInput  = document.getElementById('auth-password');
const errorEl    = document.getElementById('auth-error');
const submitBtn  = document.getElementById('emailAuthBtn');
const toggleSpan = document.getElementById('authToggleSpan');
let isSignUp = false;

function openModal()  { modal.classList.add('open'); errorEl.textContent = ''; }
function closeModal() { modal.classList.remove('open'); }

document.getElementById('openLoginBtn').addEventListener('click', openModal);
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if(e.target===modal) closeModal(); });

document.getElementById('authToggle').addEventListener('click', () => {
  isSignUp = !isSignUp;
  submitBtn.textContent  = isSignUp ? '회원가입' : '로그인';
  toggleSpan.textContent = isSignUp ? '로그인' : '회원가입';
  errorEl.textContent = '';
});

// 이메일 로그인/회원가입
document.getElementById('emailAuthBtn').addEventListener('click', async () => {
  const email = emailInput.value.trim();
  const pass  = passInput.value.trim();
  errorEl.textContent = '';
  if (!email || !pass) { errorEl.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
  if (!isFirebaseReady) { errorEl.textContent = 'Firebase가 설정되지 않았습니다.'; return; }
  try {
    if (isSignUp) {
      await auth.createUserWithEmailAndPassword(email, pass);
    } else {
      await auth.signInWithEmailAndPassword(email, pass);
    }
    closeModal();
  } catch(e) {
    const msgs = {
      'auth/wrong-password':    '비밀번호가 틀렸습니다.',
      'auth/user-not-found':    '존재하지 않는 계정입니다.',
      'auth/email-already-in-use': '이미 사용 중인 이메일입니다.',
      'auth/weak-password':     '비밀번호는 6자 이상이어야 합니다.',
      'auth/invalid-email':     '유효하지 않은 이메일입니다.',
    };
    errorEl.textContent = msgs[e.code] || e.message;
  }
});

// Google 로그인
document.getElementById('googleLoginBtn').addEventListener('click', async () => {
  if (!isFirebaseReady) { errorEl.textContent = 'Firebase가 설정되지 않았습니다.'; return; }
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
    closeModal();
  } catch(e) { errorEl.textContent = e.message; }
});

// 로그아웃
document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (isFirebaseReady) await auth.signOut();
  window._currentUser = null;
  updateAuthUI(null);
});

// 수동 저장
document.getElementById('saveBtn').addEventListener('click', () => {
  const user = window._currentUser;
  if (user) saveGame(user.uid);
});

// =============================================
//   타이틀 → 게임 전환
// =============================================
window.addEventListener('DOMContentLoaded', () => {
  const loading = document.getElementById('loading');
  const title   = document.getElementById('title-screen');
  const wrapper = document.getElementById('game-wrapper');

  window._showTitle = () => {
    loading.style.display = 'none';
    title.style.display   = 'flex';
  };

  document.getElementById('startBtn').addEventListener('click', () => {
    title.style.display  = 'none';
    wrapper.style.display = 'block';
    window._startGame();
  });
});
</script>
</body>
</html>
